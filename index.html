<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chi tiêu gia đình">
  <title>Chi tiêu Gia đình</title>

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      height: 100%; 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc; 
    }

    /* Màn hình chờ chuyên nghiệp */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .app-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      object-fit: cover;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      margin-top: 14px;
      font-size: 14px;
      color: #64748b;
      font-weight: 500;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Khung ứng dụng */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Đã ẩn loader */
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <!-- Màn hình chờ (Loader) -->
  <div id="loader">
    <img src="logo.png" alt="Logo" class="app-logo" onerror="this.style.display='none'">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải dữ liệu...</div>
  </div>

  <!-- Web App Google -->
  <iframe 
    id="app-iframe"
    src="https://script.google.com/macros/s/AKfycbwhY8YBfd6hkWaLNaNgGXxhzTQemPKZek6UudVr7lgR3SWpMFyjjHWVuHm0I9XQN8aiEQ/exec" 
    allow="fullscreen"
    loading="eager"
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.classList.add('hidden');
      }
    }

    // Tự động ẩn loader sau 8 giây đề phòng iframe không kích hoạt onload
    setTimeout(hideLoader, 8000);
  </script>
</body>
</html>
